# 테스트 전용 오버라이드 — main 의 application.yml 위에 얹힌다 (properties 가 우선).
# 테스트 DB 는 H2 in-memory. migration(V1__create_accounts.sql)은 공통 DDL 이라 H2 에서도 그대로 돈다.
# MODE=MySQL: migration 이 MySQL 문법(ALTER ... MODIFY 등)을 쓰므로 호환 모드가 필요하다.
spring.datasource.url=jdbc:h2:mem:bettingroyale;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
auth.jwt.secret=test-only-jwt-secret-0123456789abcdef-test
game-server.key=test-game-server-key
